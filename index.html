<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smooth 30 FPS Frame Scroll Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Fixed Background Canvas -->
  <div class="canvas-container">
    <canvas id="hero-canvas"></canvas>
  </div>

  <!-- Foreground Content Layer -->
  <div class="content">
    <section class="section">
      <h1>Scroll Down</h1>
      <p>Continuous 30 FPS Animation Controlled by Scroll</p>
    </section>
    <section class="section">
      <h1>10% Scroll = 30 Frames</h1>
      <p>Fast scroll karein fir bhi 30 FPS limit bani rahegi.</p>
    </section>
    <section class="section">
      <h1>50% Scroll = 150 Frames</h1>
      <p>Exactly 5 seconds me playback complete hoga.</p>
    </section>
    <section class="section">
      <h1>100% Scroll = 300 Frames</h1>
      <p>10 seconds total playback duration.</p>
    </section>
  </div>

  <!-- Loading Screen Overlay -->
  <div id="loader" class="loader-overlay">
    <div class="loader-content">
      <div class="spinner"></div>
      <p id="loader-text">Loading Images: 0 / 300</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
